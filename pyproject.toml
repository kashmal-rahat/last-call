[project]
name = "last-call-workspace"
version = "0.1.0"
description = "Last Call root workspace"
requires-python = ">=3.12"
dependencies = []

# Local-only tools: tests and scripts in scripts/. Not installed in containers.
[dependency-groups]
dev = [
    "lastcall-shared",
    "lastcall-api",
    "lastcall-voice",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "google-genai>=1.0",
    "pillow>=10.0",
]

[tool.uv.sources]
lastcall-shared = { workspace = true }
lastcall-api = { workspace = true }
lastcall-voice = { workspace = true }

[tool.uv.workspace]
members = [
    "shared",
    "services/api",
    "services/voice",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "services/api/tests", "services/voice/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["design", "data", "plans", "docs"]

[tool.ruff.lint]
# Real errors (F), style basics (E, W), import order (I) and likely bugs (B). No taste rules.
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Scripts set environment variables before importing the services they drive.
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["lastcall_shared", "lastcall_api", "lastcall_voice"]
