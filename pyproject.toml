[project]
name = "last-call-workspace"
version = "0.1.0"
description = "Last Call root workspace"
requires-python = ">=3.12"
dependencies = []

# Local-only tools: tests and scripts in scripts/. Not installed in containers.
[dependency-groups]
dev = [
    "lastcall-shared",
    "pytest>=8.0",
    "google-genai>=1.0",
    "pillow>=10.0",
]

[tool.uv.sources]
lastcall-shared = { workspace = true }

[tool.uv.workspace]
members = [
    "shared",
    "services/api",
    "services/voice",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests"]
pythonpath = ["shared"]
