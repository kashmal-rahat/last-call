[project]
name = "last-call-workspace"
version = "0.1.0"
description = "Last Call root workspace"
requires-python = ">=3.12"
dependencies = []

# Local-only tools: tests and scripts in scripts/. Not installed in containers.
[dependency-groups]
dev = [
    "lastcall-shared",
    "lastcall-api",
    "lastcall-voice",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "google-genai>=1.0",
    "pillow>=10.0",
]

[tool.uv.sources]
lastcall-shared = { workspace = true }
lastcall-api = { workspace = true }
lastcall-voice = { workspace = true }

[tool.uv.workspace]
members = [
    "shared",
    "services/api",
    "services/voice",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "services/api/tests", "services/voice/tests"]
asyncio_mode = "auto"
