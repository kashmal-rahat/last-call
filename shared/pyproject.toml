[project]
name = "lastcall-shared"
version = "0.1.0"
description = "Shared schemas, types and utilities for Last Call"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0",
    "google-cloud-firestore>=2.20",
    "tzdata",
    "httpx>=0.27.0",
    "google-genai>=2.30,<3",  # Gemini 3 settings (thinking_level); ADK 2.12 needs >=2.30 (D69)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lastcall_shared"]
