[project]
name = "lastcall-shared"
version = "0.1.0"
description = "Shared schemas, types and utilities for Last Call"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "google-cloud-firestore>=2.20",
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lastcall_shared"]
