[project]
name = "lastcall-api"
version = "0.1.0"
description = "Last Call REST API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.0.0",
    "lastcall-shared",
    "google-genai>=2.30,<3",  # Gemini 3 settings (thinking_level); ADK 2.12 needs >=2.30 (D69)
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "google-auth>=2.20.0",
    "google-cloud-storage>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lastcall_api"]

[tool.uv.sources]
lastcall-shared = { workspace = true }
