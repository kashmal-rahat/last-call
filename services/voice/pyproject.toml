[project]
name = "lastcall-voice"
version = "0.1.0"
description = "Last Call Voice Agent service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "google-adk==2.11.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "lastcall-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lastcall_voice"]

[tool.uv.sources]
lastcall-shared = { workspace = true }
